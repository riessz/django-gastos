{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Controle de Gastos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen font-sans flex items-center justify-center px-4">

    <div class="w-full max-w-sm">

        <!-- Logo / título -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-500/30">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <h1 class="text-xl font-bold text-slate-800 tracking-tight">Controle de Gastos</h1>
            <p class="text-sm text-slate-400 mt-1">Faça login para continuar</p>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">

            {% if form.errors %}
            <div class="mb-4 px-4 py-3 rounded-xl bg-rose-50 border border-rose-100 text-sm text-rose-600">
                Usuário ou senha incorretos.
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="space-y-4">
                    <div>
                        <label for="id_username" class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">
                            Usuário
                        </label>
                        <input type="text" name="username" id="id_username" autocomplete="username" autofocus
                               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-400 transition">
                    </div>

                    <div>
                        <label for="id_password" class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">
                            Senha
                        </label>
                        <input type="password" name="password" id="id_password" autocomplete="current-password"
                               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-400 transition">
                    </div>
                </div>

                <input type="hidden" name="next" value="{{ next }}">

                <button type="submit"
                        class="mt-5 w-full py-2.5 bg-gradient-to-br from-emerald-500 to-emerald-600 text-white text-sm font-semibold rounded-xl shadow-md shadow-emerald-500/30 hover:shadow-lg hover:shadow-emerald-500/40 hover:scale-[1.01] active:scale-95 transition-all duration-150">
                    Entrar
                </button>
            </form>
        </div>
    </div>

</body>
</html>
